name: e2e

on:
  push:
    branches: ["feature/**", "fix/**", "refactor/**"]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway credentials for the job's own container; nothing here is a real secret.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nutritional_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The e2e global setup derives its template ("nutritional_manager-e2e") and the per-worker databases from this URL.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nutritional_manager
      # One worker (one `next dev`) per shard: each server rewrites next-env.d.ts with its own dist dir, and on
      # Linux two servers in one checkout keep triggering each other's recompiles, so the login never completes.
      E2E_WORKERS: "1"
      # Seed the template from tests/e2e/fixtures/seed/ (there is no real database to clone in CI).
      E2E_DATA: seed
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      # Fail fast (before npm ci) when the committed e2e seed is missing.
      - name: Check e2e seed
        run: test -f tests/e2e/fixtures/seed/manifest.json || { echo "::error::No e2e seed. Run npm run e2e:snapshot locally and commit tests/e2e/fixtures/seed/"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # global-setup shells out to psql; hosted runners usually ship it, so install only when missing.
      - name: Ensure psql client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      # Applies prisma/migrations and loads the committed seed into the template database, then clones it per worker.
      - name: Run e2e shard
        run: npx playwright test --shard=${{ matrix.shard }}/3 --grep-invert @quarantine
        env:
          # next dev logs go here (outside the checkout); uploaded on failure. The runner context is not available in job-level env.
          E2E_LOG_DIR: ${{ runner.temp }}

      # Diagnostics: which files in the checkout changed during the run (a file that keeps changing makes next dev recompile).
      - name: List files changed during the run
        if: failure()
        run: find . -newer package-lock.json -type f -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./.next*" -not -path "./test-results/*" -not -path "./playwright-report/*" | head -50

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/nutrio-e2e-logs/
          retention-days: 7
          if-no-files-found: ignore
          # Includes dot-folders such as .auth.
          include-hidden-files: true
